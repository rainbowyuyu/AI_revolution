name: Source and evidence checks
on: [push, pull_request, workflow_dispatch]
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_repository.py
      - run: python tools/check_evidence.py
  types:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [overview, chapters/01-vision-choice]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
