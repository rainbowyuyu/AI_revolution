name: Source and evidence checks
on: [push, pull_request, workflow_dispatch]
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_repository.py
      - run: python tools/check_evidence.py
      - run: python chapters/02-generation/experiments/check_evidence.py
      - run: python -m pip install -r chapters/03-language-multimodal/requirements-experiments.txt
      - run: python chapters/03-language-multimodal/experiments/check_evidence.py
  types:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [overview, chapters/01-vision-choice, chapters/02-generation, chapters/03-language-multimodal]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
