<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">红伞任务路线</title><desc id="desc">文本分词、向量与位置、Transformer、下一项概率构成语言路线；CLIP用两种编码器比较图文相似度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#79d7d1"/></marker></defs><rect x="0" y="0" width="1200" height="700" rx="20" fill="#0c1824" stroke="none"/><text x="54" y="66" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="#f2eee4" text-anchor="start" font-weight="700">同一句请求，拆成可检查的计算</text><text x="54" y="108" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#aebfca" text-anchor="start" font-weight="400">“找出雨后红伞靠在蓝门边的照片，再接着写一句话。”</text><text x="54" y="169" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#dfbf83" text-anchor="start" font-weight="700">语言续写</text><rect x="54" y="194" width="196" height="100" rx="14" fill="#142536" stroke="none"/><text x="152" y="231" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#f2eee4" text-anchor="middle" font-weight="600">文字</text><text x="152" y="267" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#aebfca" text-anchor="middle" font-weight="400">字符与词块</text><path d="M252,244 L274,244" fill="none" stroke="#79d7d1" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="194" width="196" height="100" rx="14" fill="#142536" stroke="none"/><text x="378" y="231" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#f2eee4" text-anchor="middle" font-weight="600">Token ID</text><text x="378" y="267" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#aebfca" text-anchor="middle" font-weight="400">分词与查表</text><path d="M478,244 L500,244" fill="none" stroke="#79d7d1" stroke-width="2" marker-end="url(#arrow)"/><rect x="506" y="194" width="196" height="100" rx="14" fill="#142536" stroke="none"/><text x="604" y="231" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#f2eee4" text-anchor="middle" font-weight="600">向量＋位置</text><text x="604" y="267" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#aebfca" text-anchor="middle" font-weight="400">保留顺序</text><path d="M704,244 L726,244" fill="none" stroke="#79d7d1" stroke-width="2" marker-end="url(#arrow)"/><rect x="732" y="194" width="196" height="100" rx="14" fill="#142536" stroke="none"/><text x="830" y="231" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#f2eee4" text-anchor="middle" font-weight="600">Transformer</text><text x="830" y="267" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#aebfca" text-anchor="middle" font-weight="400">混合上下文</text><path d="M930,244 L952,244" fill="none" stroke="#79d7d1" stroke-width="2" marker-end="url(#arrow)"/><rect x="958" y="194" width="196" height="100" rx="14" fill="#142536" stroke="none"/><text x="1056" y="231" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#f2eee4" text-anchor="middle" font-weight="600">下一个 token</text><text x="1056" y="267" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#aebfca" text-anchor="middle" font-weight="400">概率与采样</text><text x="54" y="355" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#dfbf83" text-anchor="start" font-weight="700">图文匹配</text><rect x="54" y="382" width="245" height="88" rx="14" fill="#142536" stroke="none"/><text x="176" y="417" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#f2eee4" text-anchor="middle" font-weight="600">文本编码器</text><text x="176" y="451" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#aebfca" text-anchor="middle" font-weight="400">同一段查询 → 文本向量</text><rect x="54" y="492" width="245" height="88" rx="14" fill="#142536" stroke="none"/><text x="176" y="527" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#f2eee4" text-anchor="middle" font-weight="600">图像编码器</text><text x="176" y="561" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#aebfca" text-anchor="middle" font-weight="400">每张候选图 → 图像向量</text><path d="M301,426 L425,473" fill="none" stroke="#79d7d1" stroke-width="2" marker-end="url(#arrow)"/><path d="M301,536 L425,497" fill="none" stroke="#79d7d1" stroke-width="2" marker-end="url(#arrow)"/><rect x="439" y="423" width="270" height="120" rx="14" fill="#142536" stroke="none"/><text x="574" y="468" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#f2eee4" text-anchor="middle" font-weight="600">CLIP：相似度比较</text><text x="574" y="507" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#aebfca" text-anchor="middle" font-weight="400">同一空间中的图文向量</text><path d="M714,482 L804,482" fill="none" stroke="#79d7d1" stroke-width="2" marker-end="url(#arrow)"/><rect x="820" y="423" width="326" height="120" rx="14" fill="#142536" stroke="none"/><text x="983" y="468" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#f2eee4" text-anchor="middle" font-weight="600">候选排序</text><text x="983" y="507" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#aebfca" text-anchor="middle" font-weight="400">检查裁剪后的输入与分数</text><text x="54" y="644" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#aebfca" text-anchor="start" font-weight="400">两条路线的输出不同：一个生成后续内容，一个比较候选；本章逐项运行机制实验。</text></svg>