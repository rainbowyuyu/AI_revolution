 font-weight="400">“其他”是剩余 36 项的合计</text><text x="54" y="634" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#aebfca" text-anchor="start" font-weight="400">所有面板使用相同 0–30% 尺度。完整 40 项加总为 100%；尾部不能直接丢掉。</text><text x="54" y="671" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#aebfca" text-anchor="start" font-weight="400">种子决定抽样路径；温度决定分布形状。两者都不更新模型参数。</text></svg>